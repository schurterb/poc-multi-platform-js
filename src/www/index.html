<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Button Output Example</title>
    
    <!--<script type="module" src="https://unpkg.com/axios/dist/axios.min.js"></script>-->
    
    <script type="module" src="./js/ip.mjs"></script>
    
    <style>
      button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 10px;
      }
      button:hover {
        background-color: #3e8e41;
      }
      div {
        display: flex;
        align-items: center;
        margin-top: 20px;
      }
      label {
        font-weight: bold;
        margin-right: 10px;
      }
      output {
        border: 1px solid #ccc;
        padding: 5px;
        border-radius: 4px;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div>
      <button onclick="showOutput('Browser')">Browser</button>
      <label>Output:</label>
      <output id="Browser"></output>
    </div>
    <div>
      <button onclick="showOutput('Server')">Server</button>
      <label>Output:</label>
      <output id="Server"></output>
    </div>
    <div>
      <button onclick="showOutput('Serverless')">Serverless</button>
      <label>Output:</label>
      <output id="Serverless"></output>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
