<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Button Output Example</title>
    <style>
      button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 10px;
      }
      button:hover {
        background-color: #3e8e41;
      }
      div {
        margin-top: 20px;
      }
      label {
        font-weight: bold;
        margin-right: 10px;
      }
      output {
        border: 1px solid #ccc;
        padding: 5px;
        border-radius: 4px;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <button onclick="showOutput('output1')">Button 1</button>
    <button onclick="showOutput('output2')">Button 2</button>
    <button onclick="showOutput('output3')">Button 3</button>
    <br><br>
    <div>
      <label>Output 1:</label>
      <output id="output1"></output>
    </div>
    <div>
      <label>Output 2:</label>
      <output id="output2"></output>
    </div>
    <div>
      <label>Output 3:</label>
      <output id="output3"></output>
    </div>
    <script src="index.js"></script>
  </body></html>
